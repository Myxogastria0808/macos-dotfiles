"$schema" = "https://starship.rs/config-schema.json"
continuation_prompt = "[...](bold blue)"
format = "[┌──\\(](bold green)$username❄ $hostname[\\)-\\[](bold green)$directory[\\]](bold green) $os $git_branch$git_status$aws$azure$buf$bun$c$cmake$cobol$conda$container$crystal$daml$dart$deno$docker_context$dotnet$elixir$elm$erlang$fennel$fossil_branch$fossil_metrics$gcloud$gleam$go$guix_shell$gradle$haskell$haxe$helm$java$julia$kotlin$kubernetes$lua$meson$hg_branch$nats$nim$nix_shell$nodejs$ocaml$odin$opa$openstack$perl$php$pijul_channel$pulumi$purescript$python$quarto$rlang$raku$red$ruby$rust$scala$shell$shlvl$singularity$solidity$spack$swift$terraform$typst$vagrant$vlang$vcsh$zig$cmd_duration\n[└─](bold green)[λ ](bold blue)\n"
scan_timeout = 100

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

[character]
disabled = false
error_symbol = "[](bold red)"
success_symbol = "[](bold blue)"

[cmd_duration]
format = "  [$duration]($style)"
min_time = 1000
style = "bold yellow"

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[directory]
disabled = false
format = "[$read_only$path]($style)"
read_only = " "
read_only_style = "bold red"
style = "bold blue"
truncate_to_repo = false
truncation_length = 1
truncation_symbol = ""

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
disabled = false
format = "[$symbol$branch]($style) "
symbol = " "

[git_state]
conflicted = "!"
disabled = false
modified = "~"
staged = "✓"

[golang]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[hg_branch]
symbol = " "

[hostname]
disabled = false
format = "[$ssh_symbol$hostname]($style)"
ssh_only = false
ssh_symbol = ""
style = "bold blue"
trim_at = ""

[java]
